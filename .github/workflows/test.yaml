name: Test
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: cargo build
      - name: Install Dotenvx
        run: curl --show-error --silent https://dotenvx.sh/install.sh | sh
      - name: Test
        run: dotenvx run -- cargo test
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}
          RUST_BACKTRACE: 1
